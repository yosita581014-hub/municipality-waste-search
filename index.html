const E_GOV_LAW_IDS={"労働安全衛生規則": "347M50002000032", "クレーン等安全規則": "347M50002000034", "酸素欠乏症等防止規則": "347M50002000042"};
const ORIGINAL_TEXT={"酸素欠乏・閉所":[{"n":"酸素欠乏症等防止規則 第5条（換気）","t":"事業者は、酸素欠乏危険作業に労働者を従事させる場合は、当該作業を行う場所の空気中の酸素の濃度を十八パーセント以上（第二種酸素欠乏危険作業に係る場所にあっては、空気中の酸素の濃度を十八パーセント以上、かつ、硫化水素の濃度を百万分の十以下。）に保つように換気しなければならない。"},{"n":"酸素欠乏症等防止規則 第11条（作業主任者）","t":"酸素欠乏危険作業については、法令で定める技能講習を修了した者のうちから作業主任者を選任し、作業方法の決定、作業指揮、濃度測定、測定器具・換気装置・空気呼吸器等の点検、使用状況の監視等を行わせる。"},{"n":"酸素欠乏症等防止規則 第13条（監視）","t":"酸素欠乏危険作業に労働者を従事させる場合は、常時作業の状況を監視し、異常があったときに直ちに関係者に通報できる措置を講じる。"}],"玉掛け・吊具":[{"n":"クレーン等安全規則 第220条（作業開始前の点検）","t":"事業者は、クレーン、移動式クレーン又はデリックの玉掛用具であるワイヤロープ、つりチェーン、繊維ロープ、繊維ベルト又はフック、シャックル、リング等の金具を用いて玉掛けの作業を行うときは、その日の作業を開始する前に当該ワイヤロープ等の異常の有無について点検を行わなければならない。"},{"n":"クレーン等安全規則 第221条（就業制限）","t":"事業者は、法令で定める玉掛けの業務については、玉掛け技能講習を修了した者その他法令で定める者でなければ、当該業務に就かせてはならない。"},{"n":"クレーン等安全規則 第222条（特別の教育）","t":"事業者は、つり上げ荷重が一トン未満のクレーン、移動式クレーン又はデリックの玉掛けの業務に労働者をつかせるときは、当該労働者に対し、当該業務に関する安全のための特別の教育を行わなければならない。"}],"クレーン・移動式クレーン":[{"n":"クレーン等安全規則 第67条（特別の教育）","t":"事業者は、つり上げ荷重が一トン未満の移動式クレーンの運転の業務に労働者を就かせるときは、当該労働者に対し、当該業務に関する安全のための特別の教育を行わなければならない。"},{"n":"クレーン等安全規則 第68条（就業制限）","t":"移動式クレーンの運転業務については免許等の資格が必要であり、つり上げ荷重一トン以上五トン未満の小型移動式クレーンについては、小型移動式クレーン運転技能講習修了者が運転できる。"}],"足場・作業床":[{"n":"労働安全衛生規則 第563条（作業床）","t":"足場（一側足場を除く。）における高さ二メートル以上の作業場所には作業床を設ける。つり足場の場合を除き、幅は四十センチメートル以上、床材間の隙間は三センチメートル以下、床材と建地との隙間は十二センチメートル未満とする。"}],"墜落・高所作業":[{"n":"労働安全衛生規則 第518条","t":"高さが二メートル以上の箇所で作業を行う場合において、墜落により労働者に危険を及ぼすおそれのあるときは、足場を組み立てる等の方法により作業床を設けなければならない。"}],"車両系建設機械":[{"n":"労働安全衛生規則 第155条（作業計画）","t":"車両系建設機械を用いて作業を行うときは、あらかじめ作業計画を定め、その計画により作業を行う。作業計画には、使用する機械の種類・能力、運行経路、作業方法を示し、運行経路と作業方法を関係労働者に周知する。"},{"n":"労働安全衛生規則 第156条（制限速度）","t":"最高速度が毎時10キロメートル以下のものを除き、地形・地質等に応じた適正な制限速度をあらかじめ定め、その速度を超えて運転してはならない。"},{"n":"労働安全衛生規則 第157条（転落等の防止等）","t":"運行経路について、路肩の崩壊防止、地盤の不同沈下防止、必要な幅員の保持等、転倒・転落を防止するための措置を講じる。路肩・傾斜地等で危険があるときは誘導者を配置する。"},{"n":"労働安全衛生規則 第158条（接触の防止）","t":"運転中の車両系建設機械に接触する危険がある箇所への立入りを禁止する。ただし、誘導者を配置して誘導させる場合は除く。"}],"脚立・はしご":[{"n":"労働安全衛生規則 第526条（昇降するための設備の設置等）","t":"高さ又は深さが1.5メートルを超える箇所で作業を行うときは、安全に昇降するための設備等を設ける。"},{"n":"労働安全衛生規則 第527条（移動はしご）","t":"移動はしごは、丈夫な構造、著しい損傷・腐食等がない材料、幅30センチメートル以上、滑り止めその他の転位防止措置に適合したものでなければ使用してはならない。"},{"n":"労働安全衛生規則 第528条（脚立）","t":"脚立は丈夫な構造とし、著しい損傷・腐食等がない材料を用い、脚と水平面との角度を75度以下とする。折りたたみ式では角度を確実に保持する金具等を備え、踏み面は安全作業に必要な面積を有するものとする。"}],"足場の組立て・解体":[{"n":"労働安全衛生規則 第564条（足場の組立て等の作業）","t":"つり足場、張出し足場又は高さ2メートル以上の構造の足場の組立て、解体又は変更では、作業時期・範囲・順序の周知、関係者以外の立入禁止、悪天候時の作業中止等の措置を講じる。"},{"n":"労働安全衛生規則 第565条（足場の組立て等作業主任者の選任）","t":"法令で作業主任者の選任対象となる足場の組立て等の作業では、足場の組立て等作業主任者技能講習修了者から作業主任者を選任する。"},{"n":"労働安全衛生規則 第566条（作業主任者の職務）","t":"材料、器具・工具、墜落制止用器具、保護帽の点検、作業方法・労働者配置の決定、作業進行の監視、保護具の使用状況の監視等を行わせる。"},{"n":"労働安全衛生規則 第567条（点検）","t":"足場作業では点検者を指名し、作業開始前や悪天候・地震・組立て・一部解体・変更後などに所定事項を点検させ、異常があれば直ちに補修する。"}],"熱中症対策":[{"n":"労働安全衛生規則 第612条の2（2025年6月1日施行）","t":"熱中症を生ずるおそれのある作業について、熱中症の自覚症状がある者又は熱中症のおそれがある者を見つけた者が報告できる体制を整備して周知し、作業からの離脱、身体の冷却、必要に応じた医師の診察又は処置など、症状悪化を防ぐために必要な措置の内容と実施手順をあらかじめ定めて周知する。"},{"n":"厚生労働省 基発0520第6号（第612条の2の解釈）","t":"第612条の2は個々の事業者に措置義務を課す規定で、混在作業では元方事業者と関係請負人の各事業者にも措置義務が生じる。熱中症が疑われる場合はWBGT値や作業時間にかかわらず手順に沿って対処する。"}]};

const ARTICLE_SOURCES={"酸素欠乏・閉所":"https://laws.e-gov.go.jp/law/347M50002000042","玉掛け・吊具":"https://laws.e-gov.go.jp/law/347M50002000034","クレーン・移動式クレーン":"https://laws.e-gov.go.jp/law/347M50002000034","足場・作業床":"https://laws.e-gov.go.jp/law/347M50002000032","墜落・高所作業":"https://laws.e-gov.go.jp/law/347M50002000032","車両系建設機械":"https://laws.e-gov.go.jp/law/347M50002000032","脚立・はしご":"https://laws.e-gov.go.jp/law/347M50002000032","足場の組立て・解体":"https://laws.e-gov.go.jp/law/347M50002000032","熱中症対策":"https://laws.e-gov.go.jp/law/347M50002000032"};
const POINT_HELP={"酸素濃度": "入槽・入坑前だけでなく、再入場時や異常時など必要なタイミングで測定。測定位置や測定方法も確認する。", "硫化水素": "第二種酸素欠乏危険作業では硫化水素も管理対象。臭いの有無だけでは判断しない。", "換気": "送風機の能力・吸排気位置・ダクト配置を確認し、作業場所全体を安全な濃度に維持する。", "作業主任者": "必要な技能講習修了者が選任され、名目だけでなく作業方法の決定・濃度測定・設備点検・監視を実施しているか確認。", "救出体制": "監視人、連絡方法、空気呼吸器等、はしご・ロープ等の救出用具を事前に準備。無防備な二次災害救助を防ぐ。", "機種": "クレーン、移動式クレーン等の種類を確認。資格・検査・安全装置の規定が変わる。", "つり上げ荷重": "資格区分や適用規定を判断する基本値。機械の定格荷重と混同しない。", "運転資格": "機種とつり上げ荷重に応じ、免許・技能講習・特別教育のどれが必要か確認。", "アウトリガー": "張出し状態、地盤支持、敷板、障害物、沈下のおそれを確認。", "定格荷重": "作業半径・ブーム長等に応じた定格荷重内か確認。", "玉掛け資格": "つり上げ荷重に応じて技能講習又は特別教育の要否を確認。", "吊具の状態": "ワイヤ、スリング、シャックル、フック等の損傷・変形・摩耗・使用荷重を確認。", "荷の重心": "吊り荷の重心と玉掛け位置を確認し、傾き・荷崩れ・抜けを防止。", "合図者": "運転者と玉掛け作業者の合図方法・合図者を明確にする。", "吊り荷下の立入": "吊り荷の落下・振れ・挟まれの危険範囲へ人を入れない。", "作業床幅": "現場で実測し、法定寸法を満たすか確認。", "床材の隙間": "足先・工具の落下やつまずきにつながる隙間を確認。", "手すり・中さん": "欠損、取り外し、仮復旧、強度不足がないか確認。", "足場点検": "組立て・変更後や悪天候後など、必要な点検が実施・記録されているか確認。", "作業高さ": "床面から作業位置までの高さだけでなく、実際に墜落する高さ・開口部も確認。", "作業床の有無": "安定した作業床があるか。困難な場合の代替墜落防止措置も確認。", "開口部・端部": "手すり、覆い、囲い等の欠損・取り外し箇所を確認。", "墜落制止用器具": "必要な場合、適切な器具・取付設備・使用方法になっているか確認。"};
const PURPOSE={"酸素欠乏・閉所": "酸素欠乏症等防止規則は、タンク、ピット、マンホール、槽、サイロなど、酸素不足や硫化水素中毒が起こり得る場所で作業する人を守るための規則です。危険場所の把握、作業前の濃度測定、換気、作業主任者の選任、特別教育、監視、退避・救出体制、呼吸用保護具までを一連で規制します。単に『酸素濃度が18%以上なら入ってよい』という規則ではなく、作業中も安全な雰囲気を維持し、異常時に直ちに退避・救出できる管理体制まで求めるものです。", "クレーン・移動式クレーン": "クレーン等安全規則は、クレーンや移動式クレーンによる吊り上げ作業で、過負荷、転倒、吊り荷の落下、接触・挟まれ等を防止するための規則です。機械の種類・つり上げ荷重に応じた運転資格、定格荷重、安全装置、作業方法、点検・検査などを規制します。", "玉掛け・吊具": "玉掛けでは、吊り荷を安全にクレーンへ掛け外しするため、作業者の資格・教育、ワイヤロープやスリング等の吊具、荷の重心、合図、作業開始前点検などが規制されます。『吊る機械』だけでなく『荷をどう掛けるか』が独立した重要管理項目です。", "足場・作業床": "足場に関する規定は、高所作業中の墜落・転落と、足場材・工具等の落下を防ぐため、作業床の寸法、床材の隙間、手すり等の墜落防止設備、足場の組立て・解体・点検等を具体的に規制します。", "墜落・高所作業": "労働安全衛生規則では、高さのある場所からの墜落・転落を防ぐため、作業床、手すり・覆い等の設備、墜落制止用器具等について規定しています。『高さ2m』は重要な基準ですが、2m未満なら何をしてもよいという意味ではなく、危険の程度に応じた安全措置が必要です。"};
const ARTICLE_TEXT={"墜落・高所作業":[{"n":"安衛則 第518条","h":"高さ2m以上の作業床","s":"高さ2m以上の箇所で墜落のおそれがある場合、原則として作業床を設けます。設置が困難な場合は、防網や要求性能墜落制止用器具等の代替措置を講じます。"},{"n":"安衛則 第519条","h":"開口部・端部","s":"高さ2m以上の作業床の端や開口部等で墜落のおそれがある箇所には、囲い、手すり、覆い等の墜落防止設備を設けます。"}],"足場・作業床":[{"n":"安衛則 第563条","h":"足場の作業床","s":"高さ2m以上の足場の作業場所には作業床を設けます。つり足場を除き、幅40cm以上、床材間の隙間3cm以下、一定の場合の床材と建地との隙間12cm未満とする基準があります。墜落防止設備も必要です。"}],"車両系建設機械":[{"n":"安衛則 第155条","h":"作業計画","s":"車両系建設機械を使用するときは、機械の種類・能力、運行経路、作業方法を示した作業計画をあらかじめ定め、関係労働者へ周知します。"},{"n":"安衛則 第156条","h":"制限速度","s":"最高速度10km/h以下の機械を除き、地形・地質等に応じた適正な制限速度を定め、その速度を超えて運転してはいけません。"},{"n":"安衛則 第157条","h":"転落等の防止","s":"路肩崩壊、地盤の不同沈下等による転倒・転落を防ぐ措置が必要です。危険がある路肩・傾斜地等では誘導者を配置します。"},{"n":"安衛則 第158条","h":"接触の防止","s":"運転中の車両系建設機械に接触する危険がある箇所への立入りを禁止します。誘導者を配置して誘導させる場合は例外です。"}],"クレーン・移動式クレーン":[{"n":"クレーン則 第67条","h":"1t未満の移動式クレーン運転","s":"つり上げ荷重1t未満の移動式クレーン運転業務には、安全のための特別教育が必要です。"},{"n":"クレーン則 第68条","h":"1t以上5t未満の移動式クレーン","s":"つり上げ荷重1t以上5t未満の小型移動式クレーンは、小型移動式クレーン運転技能講習修了者が運転できます。5t以上は移動式クレーン運転士免許の区分に関係します。"},{"n":"クレーン則 第69条","h":"過負荷禁止","s":"定格荷重を超える荷重をかけて使用してはいけません。"},{"n":"クレーン則 第70条の2","h":"定格荷重の表示","s":"運転者と玉掛け作業者が定格荷重を常時把握できる表示その他の措置が必要です。"}],"玉掛け・吊具":[{"n":"クレーン則 第220条","h":"玉掛用具の点検","s":"ワイヤロープ、チェーン、繊維ロープ、繊維ベルト、フック、シャックル等は、その日の作業開始前に異常の有無を点検します。"},{"n":"クレーン則 第221条","h":"1t以上の玉掛け","s":"つり上げ荷重1t以上のクレーン等の玉掛け業務は、玉掛け技能講習修了者等の有資格者でなければ行えません。"},{"n":"クレーン則 第222条","h":"1t未満の玉掛け","s":"つり上げ荷重1t未満のクレーン等の玉掛け業務でも、特別教育が必要です。"}],"熱中症対策":[{"n":"安衛則 第612条の2","h":"熱中症を生ずるおそれのある作業","s":"熱中症の自覚症状や疑いを報告させる体制をあらかじめ整備・周知し、作業からの離脱、身体冷却、必要に応じた医師の診察等の手順も作業場ごとに定めて周知します。"}],"酸素欠乏・閉所":[{"n":"酸欠則 第1条","h":"事業者の責務","s":"酸素欠乏症等を防止するため、作業方法の確立、作業環境の整備その他の必要な措置を講ずることを求めています。"},{"n":"酸欠則 第3条・第4条","h":"作業環境の把握・測定","s":"酸素欠乏危険作業では、作業開始前などに作業場所の空気を測定し、酸素欠乏や硫化水素の危険を把握します。"},{"n":"酸欠則 第5条","h":"換気","s":"作業場所の酸素濃度を18%以上に保つよう換気します。第二種酸素欠乏危険作業では、さらに硫化水素濃度を10ppm以下に保つことが必要です。純酸素による換気は禁止されています。"},{"n":"酸欠則 第5条の2","h":"空気呼吸器等","s":"換気できない、又は著しく困難な場合には、同時就業する労働者数以上の空気呼吸器・酸素呼吸器・送気マスク等を備え、使用させます。"},{"n":"酸欠則 第11条","h":"作業主任者","s":"第一種・第二種の区分に応じた技能講習修了者から作業主任者を選任し、作業方法の決定・指揮、濃度測定、測定器具・換気装置・呼吸用保護具等の点検、使用状況の監視を行わせます。"},{"n":"酸欠則 第12条","h":"特別教育","s":"酸素欠乏危険作業に従事する労働者には、発生原因、症状、空気呼吸器等の使用方法、退避・救急そ生等について特別教育が必要です。"},{"n":"酸欠則 第13条","h":"監視","s":"作業状況を常時監視し、異常時に作業主任者や関係者へ直ちに通報できる体制を設けます。"},{"n":"酸欠則 第14条～第16条","h":"退避・救出","s":"酸素欠乏等のおそれが生じたら直ちに作業を中止して退避させ、立入禁止措置を行います。救出用具を備え、救出者には空気呼吸器等を使用させます。"}],"脚立・はしご":[{"n":"安衛則 第526条","h":"高さ・深さ1.5m超の昇降設備","s":"高さ又は深さが1.5mを超える箇所では、安全に昇降するための設備等を設けます。"},{"n":"安衛則 第527条","h":"移動はしご","s":"丈夫な構造、損傷・腐食のない材料、幅30cm以上、滑り止め等の転位防止措置が必要です。"},{"n":"安衛則 第528条","h":"脚立","s":"丈夫な構造、損傷・腐食のない材料、脚と水平面の角度75度以下、折りたたみ式の角度保持金具、必要な踏み面積が求められます。"}],"足場の組立て・解体":[{"n":"安衛則 第564条","h":"組立て・解体・変更時の措置","s":"作業順序等の周知、関係者以外の立入禁止、悪天候時の作業中止等を行います。"},{"n":"安衛則 第565条","h":"作業主任者の選任","s":"対象作業では足場の組立て等作業主任者技能講習修了者から作業主任者を選任します。"},{"n":"安衛則 第566条","h":"作業主任者の職務","s":"材料・器具・保護具の点検、作業方法と配置の決定、作業進行と保護具使用の監視を行わせます。"},{"n":"安衛則 第567条","h":"足場の点検","s":"点検者を指名し、作業開始前や悪天候・地震・足場変更後などに点検し、異常があれば補修します。"}]};

function legalType(x){

  if(/告示|通達|指針|ガイドライン/.test(x.law||""))return "告示・通達・指針";
  if(/社内|現場|構内|ルール/.test(x.law||""))return "現場ルール";
